[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "eka-abdm"
version = "0.1.0"
description = "Eka Care ABDM Connect Python SDK"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "abdm-ecdh>=1.0.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
